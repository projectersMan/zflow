<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">zFlow website preview</title>
  <desc id="desc">A preview card for the zFlow product website.</desc>
  <rect width="1600" height="900" fill="#071112"/>
  <rect x="1" y="1" width="1598" height="898" fill="none" stroke="#263a3d" stroke-width="2"/>
  <text x="96" y="150" fill="#c6d8d3" font-family="Menlo, Consolas, monospace" font-size="28" font-weight="700" letter-spacing="0">ZFLOW.DEV</text>
  <text x="96" y="295" fill="#effbf2" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="82" font-weight="800">Local-first terminal</text>
  <text x="96" y="392" fill="#effbf2" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="82" font-weight="800">recommendations</text>
  <text x="96" y="485" fill="#9bb1ad" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="30">Start zFlow, get command suggestions, choose a candidate,</text>
  <text x="96" y="535" fill="#9bb1ad" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="30">execute it, and switch between Bottom and Inline modes.</text>
  <rect x="96" y="625" width="270" height="70" rx="10" fill="#d8ffe2"/>
  <text x="132" y="671" fill="#071112" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="26" font-weight="800">Open website</text>
  <rect x="710" y="138" width="790" height="590" rx="18" fill="#101b1d" stroke="#2e464b" stroke-width="2"/>
  <rect x="770" y="190" width="670" height="32" rx="16" fill="#575d5c"/>
  <rect x="770" y="245" width="670" height="335" fill="#1f1f1f"/>
  <text x="795" y="285" fill="#d7ddd8" font-family="Menlo, Consolas, monospace" font-size="18">$ npm i -g zflow-cli</text>
  <text x="795" y="325" fill="#d7ddd8" font-family="Menlo, Consolas, monospace" font-size="18">$ zflow</text>
  <rect x="864" y="365" width="345" height="34" rx="17" fill="#2c2116"/>
  <text x="887" y="388" fill="#f3b66d" font-family="Menlo, Consolas, monospace" font-size="18">npm run build</text>
  <text x="795" y="642" fill="#d7ddd8" font-family="Menlo, Consolas, monospace" font-size="22" font-weight="700">Install. Start. Suggest. Select.</text>
  <circle cx="1324" cy="642" r="34" fill="#d8ffe2"/>
  <path d="M1316 624 L1316 660 L1346 642 Z" fill="#071112"/>
</svg>
